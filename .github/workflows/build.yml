name: build

on:
  push:
    branches: [main, "perf/reader-latency-and-lettering"]
    paths-ignore:
      - "site/**"
      - "marketing/**"
      - "**.md"
  pull_request:
  workflow_dispatch:
    inputs:
      reader_order:
        description: Order for the two Android builds on the same emulator
        type: choice
        default: baseline-first
        options: [baseline-first, candidate-first]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MangaLens-apk
          path: app/build/outputs/apk/debug/*.apk

  reader-experience:
    if: github.event_name != 'push' || github.ref == 'refs/heads/perf/reader-latency-and-lettering'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build the release baseline, candidate and common device tests
        run: |
          git fetch --depth=1 origin tag v1.1.4
          baseline="$RUNNER_TEMP/mangalens-baseline"
          git worktree add --detach "$baseline" v1.1.4
          cp app/build.gradle.kts "$baseline/app/build.gradle.kts"
          cp -R app/src/debug "$baseline/app/src/debug"
          "$baseline/gradlew" -p "$baseline" -PreaderEmulator :app:assembleDebug
          ./gradlew -PreaderEmulator :app:assembleDebug :app:assembleDebugAndroidTest
          mkdir -p app/build/reader-baseline
          cp "$baseline/app/build/outputs/apk/debug/app-debug.apk" app/build/reader-baseline/baseline.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Fetch the credited Korean comic page used by the reader test
        run: bash tools/fetch-reader-page.sh
      - name: Read fixture pages on an Android screen
        uses: reactivecircus/android-emulator-runner@v2
        env:
          READER_ORDER: ${{ inputs.reader_order || 'baseline-first' }}
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 2048M
          script: bash tools/test-reader-on-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-experience
          path: app/build/reader-experience
          if-no-files-found: warn
