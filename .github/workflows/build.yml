name: build

on:
  push:
    branches: [main, "perf/reader-latency-and-lettering"]
    paths-ignore:
      - "site/**"
      - "marketing/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MangaLens-apk
          path: app/build/outputs/apk/debug/*.apk

  reader-experience:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/perf/reader-latency-and-lettering'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build the app and device tests
        run: ./gradlew --no-daemon -PreaderEmulator :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Read fixture pages on an Android screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 2048M
          script: bash tools/test-reader-on-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-experience
          path: app/build/reader-experience
          if-no-files-found: warn
