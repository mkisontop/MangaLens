name: Inspect published reader fixtures
on:
  push:
    branches: ["perf/reader-latency-and-lettering"]
    paths: [".github/workflows/inspect-reader-art.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read the published source pages
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow==11.3.0
          python3 - <<'PY'
          import base64, hashlib, io, textwrap, urllib.request
          from PIL import Image, ImageDraw
          base = "https://www.peppercarrot.com/0_sources/ep06_The-Potion-Contest/low-res/kr_Pepper-and-Carrot_by-David-Revoy_E06P"
          sheet = Image.new("RGB", (1380, 1400), "white")
          draw = ImageDraw.Draw(sheet)
          def emit(name, picture):
              f = io.BytesIO()
              picture.save(f, format="JPEG", quality=87)
              print("MangaLensDetail " + name)
              for part in textwrap.wrap(base64.b64encode(f.getvalue()).decode(), 960):
                  print("MangaLensFrame " + part)
          for i in range(1, 7):
              try:
                  data = urllib.request.urlopen(base + f"{i:02d}.jpg", timeout=30).read()
                  img = Image.open(io.BytesIO(data)).convert("RGB")
              except Exception as error:
                  print(i, error)
                  continue
              print("Official page", i, img.size, hashlib.sha256(data).hexdigest())
              large = img.copy()
              large.thumbnail((860, 1200))
              emit(f"page-{i}", large)
              img.thumbnail((460,645))
              x, y = ((i-1)%3)*460, ((i-1)//3)*700
              sheet.paste(img, (x,y))
              draw.text((x+18,y+650),f"Official page {i}",fill="black")
          emit("overview",sheet)
          PY
