name: Published reader pages on Android 15
on:
  push:
    branches: ["test/reader-screenshot-inspection"]
  workflow_dispatch:
    inputs:
      revision:
        description: MangaLens commit to check
        type: string
        default: "e8bbbc18ddd2396cda477d1e402f1af7e53aeefb"
permissions:
  contents: read
jobs:
  read-on-android-15:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || 'e8bbbc18ddd2396cda477d1e402f1af7e53aeefb' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build and fetch the published Korean comic
        run: |
          ./gradlew -PreaderPreview -PreaderEmulator :app:assembleDebug :app:assembleDebugAndroidTest
          bash tools/fetch-reader-page.sh
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Read the published balloons on the target Android SDK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 2048M
          script: |
            mkdir -p app/build/android-15
            adb shell settings put global hide_error_dialogs 1
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb shell wm size 720x1280
            adb shell wm density 280
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            adb install -r -g app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            bash tools/fetch-reader-page.sh app.mangalens.preview
            adb shell am start -W -n app.mangalens.preview/app.mangalens.MainActivity | tee app/build/android-15/home-launch.txt
            grep -Eq '^Status: ok' app/build/android-15/home-launch.txt
            adb shell am force-stop app.mangalens.preview
            adb logcat -c
            adb shell am instrument -w -r -e build candidate -e class 'app.mangalens.reader.PublishedComicExperienceTest#publishedKoreanBalloonsShowReadableEnglishWithinTheirOwnPanels,app.mangalens.reader.PublishedComicExperienceTest#followRealArtworkByTheExactNumberOfScrolledPixels' app.mangalens.preview.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/android-15/instrumentation.txt
            adb logcat -d -s MangaLensUX:I > app/build/android-15/recognition.txt
            cat app/build/android-15/recognition.txt
            adb exec-out run-as app.mangalens.preview tar -cf - -C files/reader-ux candidate > app/build/android-15/screens.tar
            tar -xf app/build/android-15/screens.tar -C app/build/android-15
            rm app/build/android-15/screens.tar
            cat app/build/android-15/candidate/published.csv app/build/android-15/candidate/published-scroll.csv
            adb logcat -b events -d -s am_anr am_crash > app/build/android-15/process-events.txt
            ! grep -E 'am_(anr|crash).*[, ]app\.mangalens([.:, ]|$)' app/build/android-15/process-events.txt
            grep -Eq '^OK \(2 tests\)' app/build/android-15/instrumentation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-15-published-reader
          path: app/build/android-15
