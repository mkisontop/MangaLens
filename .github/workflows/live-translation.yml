name: Dialogue role probe
on:
  workflow_dispatch:
  push:
    branches: ["perf/short-vision-instructions"]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        vision: ["0", "1"]
    steps:
      - uses: actions/checkout@v4
      - name: Read the actual dialogue corrections from the pinned model
        env:
          MANGALENS_LIVE_VISION: ${{ matrix.vision }}
          MANGALENS_MODEL_PROBE: "1"
          MANGALENS_CLASSIFY_ONLY: "1"
        run: bash tools/test-live-translation.sh python3 tools/probe-dialogue-roles.py
