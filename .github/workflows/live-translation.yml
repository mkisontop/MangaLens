name: Published dialogue localization check

on:
  workflow_dispatch:
  push:
    branches: ["test/reader-dialogue-localization"]
    paths:
      - ".github/workflows/live-translation.yml"
      - "tools/test-live-translation.sh"
      - "app/src/test/java/app/mangalens/translate/LiveTranslationQualityTest.kt"
      - "app/src/androidTest/java/app/mangalens/reader/PublishedComicExperienceTest.kt"
      - "tools/test-live-panel-on-device.sh"
      - "tools/setup-reader-device.sh"
      - "tools/observe-panel-model.py"
      - "app/src/main/java/app/mangalens/translate/**"
      - "app/src/main/java/app/mangalens/pipeline/**"

permissions:
  contents: read

jobs:
  published-page-on-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build the Android reader and fetch the credited comic
        run: |
          ./gradlew -PreaderEmulator -PreaderPreview :app:assembleDebug :app:assembleDebugAndroidTest
          bash tools/fetch-reader-page.sh
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Read a Korean comic panel with the pinned model and the Android compositor
        env:
          MANGALENS_LIVE_VISION: "1"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 2048M
          script: bash tools/test-live-translation.sh bash tools/test-live-panel-on-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-published-page
          path: app/build/reader-live-device
